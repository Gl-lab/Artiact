name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  solution:
    name: Solution build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore Artiact.sln

      - name: Build solution
        run: dotnet build Artiact.sln --no-restore --warnaserror

      - name: Test solution
        run: dotnet test Artiact.sln --no-build --no-restore

      - name: Deterministic staged HTTP acceptance
        run: >-
          dotnet test Artiact.MockService.Tests/Artiact.MockService.Tests.csproj
          --no-build --no-restore
          --filter "FullyQualifiedName~StrategyPortfolioFlowTests|FullyQualifiedName~StagedOperationTests"

      - name: Build default-inspect container without running it
        run: docker build --file Artiact/Dockerfile --tag artiact:ci .

  real-api-offline:
    name: Real API boundary tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore offline test project
        run: dotnet restore Artiact.RealApiTests/Artiact.RealApiTests.csproj

      - name: Test offline API boundary
        run: >-
          dotnet test Artiact.RealApiTests/Artiact.RealApiTests.csproj
          --no-restore
          --filter Category=RealApiOffline
